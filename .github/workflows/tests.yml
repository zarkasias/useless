name: Tests

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main
      - chore/monorepo-web-move

jobs:
  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter @useless/web test:coverage

      - name: Add coverage summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const path = 'apps/web/coverage/coverage-summary.json';

          if (!fs.existsSync(path)) {
            console.log('Coverage summary not found.');
            process.exit(0);
          }

          const data = JSON.parse(fs.readFileSync(path, 'utf8')).total;

          const summary = [
            '## Unit Test Coverage',
            '',
            '| Metric | Coverage |',
            '|---|---:|',
            \`| Statements | \${data.statements.pct}% |\`,
            \`| Branches | \${data.branches.pct}% |\`,
            \`| Functions | \${data.functions.pct}% |\`,
            \`| Lines | \${data.lines.pct}% |\`,
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          "
